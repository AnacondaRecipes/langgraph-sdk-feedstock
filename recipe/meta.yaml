{% set name = "langgraph-sdk" %}
{% set version = "0.4.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
    sha256: b88f0f5f6328ac0680d6790614a905b2bcfa257f2276dba4e38f0e86db0aa738
  - url: https://github.com/langchain-ai/langgraph/archive/refs/tags/sdk=={{ version }}.tar.gz
    sha256: 86c2bddc800e7ccd45e5cc7b95e6d2d33a410f3899057e3216703271acd3f1f1
    folder: gh_src

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: True  # [py<310]

requirements:
  host:
    - python
    - pip
    - hatchling
  run:
    - python
    - httpx >=0.25.2
    - langchain-core >=1.4.0,<2
    - langchain-protocol >=0.0.15
    - orjson >=3.11.5
    - typing_extensions
    - websockets >=14,<16

test:
  source_files:
    - gh_src/libs/sdk-py
  imports:
    - langgraph_sdk
    - langgraph_sdk.auth
    - langgraph_sdk.client
    - langgraph_sdk.schema
    - langgraph_sdk.sse
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # tests/integration/ imports langgraph (not a dep of this package) and fails at collection
    # before -m 'not integration' can filter it out
    - pytest -v gh_src/libs/sdk-py --ignore=gh_src/libs/sdk-py/tests/integration
  requires:
    - pip
    - pytest
    - pytest-asyncio
    - pytest-mock
    - pydantic >=2.12.4
    - starlette

about:
  home: https://www.github.com/langchain-ai/langgraph
  summary: SDK for interacting with LangGraph API
  license: MIT
  license_family: MIT
  license_file: LICENSE
  description: This repository contains the Python SDK for interacting with the LangGraph Platform REST API.
  dev_url: https://github.com/langchain-ai/langgraph/tree/main/libs/sdk-py
  doc_url: https://github.com/langchain-ai/langgraph/blob/main/libs/sdk-py/README.md

extra:
  recipe-maintainers:
    - jan-janssen
