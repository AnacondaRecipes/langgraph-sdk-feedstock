{% set name = "langgraph-sdk" %}
{% set version = "0.4.10" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
    sha256: d8d7afd326b4df42ddc0878b7fbf53f03c3237c664c236bf5bac4ab16fc38ed9

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - hatchling
  run:
    - python
    - httpx >=0.25.2
    - orjson >=3.11.5
    - langchain-protocol >=0.0.15
    - langchain-core >=1.4.0,<2
    - websockets >=14,<17

test:
  source_files:
    - tests
    - pyproject.toml
  imports:
    - langgraph_sdk
    - langgraph_sdk.auth
    - langgraph_sdk.client
    - langgraph_sdk.schema
    - langgraph_sdk.sse
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # integration tests require a live langgraph-api server on localhost:2024, so deselect them
    - pytest -vv tests -m "not integration"
  requires:
    - pip
    - pytest
    - pytest-asyncio
    - pytest-mock
    - pydantic >=2.12.4
    - starlette
    - langgraph

about:
  home: https://www.github.com/langchain-ai/langgraph
  summary: SDK for interacting with LangGraph API
  license: MIT
  license_family: MIT
  license_file: LICENSE
  description: This repository contains the Python SDK for interacting with the LangGraph Platform REST API.
  dev_url: https://github.com/langchain-ai/langgraph/tree/main/libs/sdk-py
  doc_url: https://github.com/langchain-ai/langgraph/blob/main/libs/sdk-py/README.md

extra:
  recipe-maintainers:
    - jan-janssen
